name: CI/CD

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      HAS_SUPABASE_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contract tests
        run: npm test

      - name: Supabase public audit
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm run audit:supabase:public

      - name: Skip Supabase public audit
        if: env.HAS_SUPABASE_SECRETS != 'true'
        run: echo "NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY were not configured; skipping public Supabase audit."

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HAS_VERCEL_SECRETS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npm ci

      - name: Pull Vercel environment
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build with Vercel
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: env.HAS_VERCEL_SECRETS == 'true'
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Skip deploy
        if: env.HAS_VERCEL_SECRETS != 'true'
        run: echo "Vercel secrets were not configured; quality checks passed, deploy skipped."
