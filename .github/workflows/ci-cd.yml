name: CI/CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      HAS_SUPABASE_SECRETS: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contract tests
        run: npm test

      - name: Supabase public audit
        if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm run audit:supabase:public

      - name: Skip Supabase public audit
        if: env.HAS_SUPABASE_SECRETS != 'true'
        run: echo "Supabase secrets not configured; public audit skipped."

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/ige-next.log 2>&1 &
          echo $! > /tmp/ige-next.pid

      - name: Wait for production server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ige-next.log
          exit 1

      - name: Application smoke audit
        env:
          APP_BASE_URL: http://127.0.0.1:3000
          APP_EXPECT_PRODUCTION_CSP: "true"
        run: npm run audit:app:smoke

      - name: Print production server logs on failure
        if: failure()
        run: test ! -f /tmp/ige-next.log || cat /tmp/ige-next.log

      - name: Stop production server
        if: always()
        run: test ! -f /tmp/ige-next.pid || kill "$(cat /tmp/ige-next.pid)" || true
